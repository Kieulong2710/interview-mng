spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=InterviewManagement2;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# Tao OAuth 2.0 Client ID tai https://console.cloud.google.com/apis/credentials
# roi set 2 bien moi truong GOOGLE_CLIENT_ID va GOOGLE_CLIENT_SECRET truoc khi chay
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}

